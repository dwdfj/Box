name: Test Build

on:
  workflow_dispatch:
    inputs:
      wallpaper:
        description: '内置壁纸开关: true=带小贾内置壁纸 / false=纯色主题(无壁纸版)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
      - name: Setup Python 3.10 (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build With Gradle
        run: |
          export CHAQUOPY_PYTHON=$(which python)
          chmod +x gradlew
          ./gradlew assemblerelease --build-cache --parallel --daemon --warning-mode all -PxjWallpaper=${{ github.event.inputs.wallpaper || 'true' }}
      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          for file in `find ~ -name "*.apk" -print`; do
            mv "$file" ${{ github.workspace }}/apk/
          done
      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.tvbox.osc
          path: ${{ github.workspace }}/apk/*
          if-no-files-found: error
